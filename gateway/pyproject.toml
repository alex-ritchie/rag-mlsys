[project]
name = "mlsys-gateway"
version = "0.1.0"
description = "FastAPI RAG gateway: /api/ask SSE pipeline, OpenAI shim, metrics, demo profile"
requires-python = ">=3.12"
dependencies = [
  "mlsys-common", "mlsys-embedder", "mlsys-reranker",
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "sse-starlette>=2.1", "httpx>=0.27",
  "prometheus-client>=0.21", "anthropic>=0.40", "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["mlsys_gateway"]
[tool.uv.sources]
mlsys-common = { workspace = true }
mlsys-embedder = { workspace = true }
mlsys-reranker = { workspace = true }
