# Primary model (spec §5.4). Every benchmark result JSON embeds this file.
engine: vllm
model: dbirks/Qwen3.8-27B-W4A16-AutoRound
served_model_name: qwen38-27b-w4a16
port: 8003
args:
  max-model-len: 32768
  gpu-memory-utilization: 0.95        # 0.90 leaves only 1.52 GiB KV on 24 GB (engine refuses 32K); 0.95 -> 4.78 GiB (M3 measured)
  enable-prefix-caching: true
  reasoning-parser: qwen3
  language-model-only: true          # skip the vision tower (flag name per Qwen3.6 recipes; verify at M3)
  max-num-seqs: 32
  dtype: auto
  trust-remote-code: true
  # quantization is auto-detected from config.json (compressed-tensors pack-quantized -> Marlin int4 on sm_86)
  # enforce-eager: true              # escape hatch if CUDA-graph capture OOMs; record which mode ran
  # speculative-config: '{"method":"mtp","num_speculative_tokens":2}'   # M8 lever
env:
  VLLM_USE_V1: "1"
notes: |
  Ampere (sm_86): no FP8/NVFP4 kernels. W4A16 compressed-tensors runs through Marlin.
  M3 (2026-08-21, vLLM 0.27.1+cu129, torch 2.13.0+cu129, transformers 5.15.1): weights 16.84 GiB,
  KV 4.78 GiB (67,584 tokens) at util 0.95, VRAM 22.9 GB steady under the c8 soak, CUDA graphs on.
  Consequence: embedder and reranker run on CPU (nothing else fits) — docs/benchmarks/m3-baseline.md.
