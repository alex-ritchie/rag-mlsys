# Bonus cell: Qwen3.5-9B unquantized BF16 — "what did 4-bit cost the 9B" (the 27B cannot be run unquantized).
engine: vllm
model: Qwen/Qwen3.5-9B
served_model_name: qwen35-9b-bf16
port: 8003
args:
  max-model-len: 8192               # RAG prompts are 3-4.5K tokens; frees vLLM reserve for the co-resident services
  gpu-memory-utilization: 0.90        # 16.8 GiB weights: 0.80 leaves no KV at all ("No available memory for the cache blocks")
  enable-prefix-caching: true
  reasoning-parser: qwen3
  language-model-only: true
  max-num-seqs: 32
  dtype: bfloat16
  trust-remote-code: true
env:
  VLLM_USE_V1: "1"
