# Model slate (spec §5.3). Repo IDs are config, not code — they drift. All Apache-2.0.
embedding:
  repo: BAAI/bge-m3
  dim: 1024
  onnx_repo: BAAI/bge-m3            # exported locally by scripts/export_onnx.py (int8) for the demo profile
reranker:
  repo: BAAI/bge-reranker-v2-m3
  top_n_in: 30
  top_k_out: 5

llm:
  primary:
    name: qwen38-27b-w4a16
    display: "Qwen3.8-27B W4A16 (vLLM)"
    engine: vllm
    repo_candidates:                 # tried in order at M3; the first that serves is pinned here
      - dbirks/Qwen3.8-27B-W4A16-AutoRound
      # - <philbert440 base-model AWQ build> — verify on HF at build time (spec §5.3)
    serving_config: config/serving/vllm-qwen38-27b.yaml
  size_ablation:
    name: qwen35-9b-w4a16
    display: "Qwen3.5-9B W4A16 (vLLM)"
    engine: vllm
    repo_candidates:
      - RedHatAI/Qwen3.5-9B-quantized.w4a16   # same compressed-tensors pack-quantized format as the 27B (chosen 2026-08-22)
      - QuantTrio/Qwen3.5-9B-AWQ              # most-downloaded alternative (AWQ-Marlin)
      - Intel/Qwen3.5-9B-int4-AutoRound
    serving_config: config/serving/vllm-qwen35-9b.yaml
    varies: "parameter count, same family"
  size_ablation_bf16:
    name: qwen35-9b-bf16
    display: "Qwen3.5-9B BF16 (vLLM)"
    engine: vllm
    repo_candidates: [Qwen/Qwen3.5-9B]
    serving_config: config/serving/vllm-qwen35-9b-bf16.yaml
    varies: "quantization (4-bit vs none), same model"
  size_ablation_w8a8:
    name: qwen35-9b-w8a8
    display: "Qwen3.5-9B W8A8 (vLLM)"
    engine: vllm
    repo_candidates: [RedHatAI/Qwen3.5-9B-quantized.w8a8]
    serving_config: config/serving/vllm-qwen35-9b-w8a8.yaml
    varies: "int8 weights+activations vs W4A16"
  arch_ablation:
    name: qwen36-35b-a3b-awq
    display: "Qwen3.6-35B-A3B AWQ int4 (vLLM)"
    engine: vllm
    repo_candidates:
      - Intel/Qwen3.6-35B-A3B-int4-mixed-AutoRound  # chosen 2026-08-22: attention quantized too -> ~19.2 GiB on GPU (the only build that leaves KV room on 24 GB)
      - cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit        # attention left in F16 -> 22.0 GiB on GPU: OOMs in torch.compile on the 3090 Ti
      - QuantTrio/Qwen3.6-35B-A3B-AWQ            # same layout as cyankiwi
    serving_config: config/serving/vllm-qwen36-35b-a3b-intel.yaml
    varies: "dense vs MoE, same family"
  engine_ablation:
    name: qwen38-27b-gguf-ud-q4km
    display: "Qwen3.8-27B UD-Q4_K_M (llama.cpp)"
    engine: llamacpp
    repo: unsloth/Qwen3.8-27B-GGUF
    file: Qwen3.8-27B-UD-Q4_K_M.gguf
    serving_config: config/serving/llamacpp-qwen38-27b.yaml
    varies: "serving engine, same model"
  fallback_primary:                  # spec §9: promote if Qwen3.8 cannot be made to serve within ~2 days
    name: qwen36-27b-awq
    display: "Qwen3.6-27B AWQ (vLLM)"
    engine: vllm
    repo_candidates: []

judge:
  provider: anthropic
  model: claude-haiku-4-5
demo_generation:
  provider: anthropic
  model: claude-haiku-4-5
