[project]
name = "mlsys-common"
version = "0.1.0"
description = "Shared contracts, settings, and DB access for the MLSysBook RAG services"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "pyyaml>=6.0",
  "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlsys_common"]
