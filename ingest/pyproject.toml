[project]
name = "mlsys-ingest"
version = "0.1.0"
description = "Fetch, parse, chunk, and load the MLSysBook sources"
requires-python = ">=3.12"
dependencies = ["mlsys-common", "pyyaml>=6.0", "typer>=0.12", "rich>=13"]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.20", "huggingface-hub>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlsys_ingest"]

[tool.uv.sources]
mlsys-common = { workspace = true }
