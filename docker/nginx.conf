server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
  # Same-origin API proxy (compose + k8s); the frontend uses VITE_API_BASE="" => relative /api
  location /api/ { proxy_pass http://gateway:8000/api/; proxy_buffering off; proxy_read_timeout 600s; proxy_set_header X-Forwarded-For $remote_addr; }
  location /v1/  { proxy_pass http://gateway:8000/v1/;  proxy_buffering off; proxy_read_timeout 600s; proxy_set_header X-Forwarded-For $remote_addr; }
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Cache-Control "public, max-age=3600";
}
