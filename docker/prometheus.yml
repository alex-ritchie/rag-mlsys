global: {scrape_interval: 10s, evaluation_interval: 15s}
rule_files: [/etc/prometheus/alert-rules.yml]
scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: vllm
    static_configs: [{targets: ["vllm:8003"]}]
  - job_name: embedder
    static_configs: [{targets: ["embedder:8001"]}]
  - job_name: reranker
    static_configs: [{targets: ["reranker:8002"]}]
  - job_name: dcgm
    static_configs: [{targets: ["dcgm-exporter:9400"]}]
