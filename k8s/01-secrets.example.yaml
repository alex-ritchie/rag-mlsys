# Copy to k8s/secrets.yaml (gitignored) and fill in. `kubectl apply -f k8s/` applies this example
# with empty values so the stack comes up without the demo key; the local profile does not need one.
apiVersion: v1
kind: Secret
metadata:
  name: mlsys-secrets
  namespace: mlsysbook
type: Opaque
stringData:
  POSTGRES_PASSWORD: mlsys
  ANTHROPIC_API_KEY: ""
