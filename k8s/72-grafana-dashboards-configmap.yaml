# Generated from k8s/grafana/dashboards/*.json by scripts/sync_k8s_configmaps.py — edit the JSON files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: mlsysbook
data:
  1-infra.json: |
    {
      "uid": "mlsys-infra",
      "title": "MLSysBook RAG \u2014 1 Infra",
      "tags": [
        "mlsysbook",
        "infra"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "GPU utilization",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_GPU_UTIL",
              "legendFormat": "gpu {{gpu}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "VRAM used / total",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_FB_USED",
              "legendFormat": "used MiB"
            },
            {
              "refId": "B",
              "expr": "DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE",
              "legendFormat": "total MiB"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "GPU power",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "DCGM_FI_DEV_POWER_USAGE",
              "legendFormat": "watts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Gateway replicas (HPA)",
          "description": "The HPA demo panel: 1 -> 4 -> 1 under load.",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up{app=\"gateway\"} == 1)",
              "legendFormat": "ready replicas"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"gateway\"}",
              "legendFormat": "hpa desired"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Gateway CPU per pod",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"mlsysbook\",container=\"gateway\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Pod memory (working set)",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"mlsysbook\",container!=\"\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Pod CPU (all)",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"mlsysbook\",container!=\"\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
  2-serving.json: |
    {
      "uid": "mlsys-serving",
      "title": "MLSysBook RAG \u2014 2 Serving",
      "tags": [
        "mlsysbook",
        "serving"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rag_requests_total[1m]))",
              "legendFormat": "req/s"
            },
            {
              "refId": "B",
              "expr": "sum(rate(rag_requests_total{status=\"error\"}[1m]))",
              "legendFormat": "errors/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "TTFT p50 / p99",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum(rate(rag_ttft_seconds_bucket[2m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum(rate(rag_ttft_seconds_bucket[2m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "End-to-end p50 / p99",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum(rate(rag_e2e_seconds_bucket[2m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum(rate(rag_e2e_seconds_bucket[2m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Per-stage p50",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum(rate(rag_stage_seconds_bucket{stage=\"embed\"}[2m])) by (le))",
              "legendFormat": "embed"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.5, sum(rate(rag_stage_seconds_bucket{stage=\"retrieve\"}[2m])) by (le))",
              "legendFormat": "retrieve"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.5, sum(rate(rag_stage_seconds_bucket{stage=\"rerank\"}[2m])) by (le))",
              "legendFormat": "rerank"
            },
            {
              "refId": "D",
              "expr": "histogram_quantile(0.5, sum(rate(rag_stage_seconds_bucket{stage=\"generate\"}[2m])) by (le))",
              "legendFormat": "generate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Gateway overhead p50 / p99 (excl. model + services)",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum(rate(rag_gateway_overhead_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.99, sum(rate(rag_gateway_overhead_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "vLLM running / waiting sequences",
          "description": "Queue depth and batch occupancy \u2014 the interesting signals of the single-GPU tier.",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "vllm:num_requests_running",
              "legendFormat": "running"
            },
            {
              "refId": "B",
              "expr": "vllm:num_requests_waiting",
              "legendFormat": "waiting"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "vLLM KV-cache utilization",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "vllm:gpu_cache_usage_perc",
              "legendFormat": "kv cache"
            },
            {
              "refId": "B",
              "expr": "vllm:gpu_prefix_cache_hit_rate",
              "legendFormat": "prefix hit rate"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Tokens/s",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rag_tokens_total{kind=\"completion\"}[1m]))",
              "legendFormat": "completion tok/s (gateway)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(vllm:generation_tokens_total[1m]))",
              "legendFormat": "generation tok/s (vLLM)"
            },
            {
              "refId": "C",
              "expr": "sum(rate(vllm:prompt_tokens_total[1m]))",
              "legendFormat": "prompt tok/s (vLLM)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Error rate",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rag_requests_total{status=\"error\"}[5m])) / sum(rate(rag_requests_total[5m]))",
              "legendFormat": "error ratio"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "In-flight requests",
          "description": "",
          "gridPos": {
            "x": 8,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rag_inflight_requests)",
              "legendFormat": "in-flight"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Embedder / reranker p50",
          "description": "",
          "gridPos": {
            "x": 16,
            "y": 24,
            "w": 8,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum(rate(embedder_request_seconds_bucket[2m])) by (le))",
              "legendFormat": "embed"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.5, sum(rate(reranker_request_seconds_bucket[2m])) by (le))",
              "legendFormat": "rerank"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {}
        }
      ]
    }
  3-quality.json: |
    {
      "uid": "mlsys-quality",
      "title": "MLSysBook RAG \u2014 3 Quality",
      "tags": [
        "mlsysbook",
        "quality"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "type": "gauge",
          "title": "Nightly groundedness",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_nightly_groundedness",
              "legendFormat": "groundedness (7d mean)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "green",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          }
        },
        {
          "type": "gauge",
          "title": "Nightly faithfulness",
          "description": "",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_nightly_faithfulness",
              "legendFormat": "faithfulness (7d mean)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.7
                  },
                  {
                    "color": "green",
                    "value": 0.85
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "showThresholdMarkers": true
          }
        },
        {
          "type": "stat",
          "title": "Judge-flagged answers (7d)",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_judge_flagged_7d",
              "legendFormat": "flagged"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "stat",
          "title": "Answers judged (7d)",
          "description": "",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_judged_answers_7d",
              "legendFormat": "judged"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "type": "timeseries",
          "title": "Groundedness trend",
          "description": "A sustained drop after a re-index or prompt change is the signal this panel exists for.",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_nightly_groundedness",
              "legendFormat": "groundedness"
            },
            {
              "refId": "B",
              "expr": "rag_nightly_faithfulness",
              "legendFormat": "faithfulness"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Rerank score p50 (online retrieval-quality proxy)",
          "description": "Cheap online proxy: a sustained drop means retrieval drift.",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_retrieval_score_p50",
              "legendFormat": "mean rerank score p50 (24h)"
            },
            {
              "refId": "B",
              "expr": "rag_retrieval_top1_score_p50",
              "legendFormat": "top-1 rerank score p50 (24h)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "timeseries",
          "title": "Abstention rate",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rag_abstention_rate_24h",
              "legendFormat": "abstention rate (24h)"
            },
            {
              "refId": "B",
              "expr": "sum(rate(rag_abstentions_total[15m])) / sum(rate(rag_requests_total{route=\"ask\"}[15m]))",
              "legendFormat": "abstention ratio (15m)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "type": "heatmap",
          "title": "Top-1 rerank score distribution",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(rag_rerank_top1_score_bucket[15m])) by (le)",
              "legendFormat": "{{le}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
