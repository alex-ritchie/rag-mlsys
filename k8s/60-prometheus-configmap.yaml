# Minimal hand-written scrape config (spec §5.8): gateway, vLLM, embedder/reranker, DCGM, kubelet/cAdvisor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: mlsysbook
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/rules/alert-rules.yml]
    scrape_configs:
      - job_name: mlsysbook-pods            # gateway, vllm, embedder, reranker via pod annotations
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [mlsysbook]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
          - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+)}
          - {source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port], action: replace, regex: ([^:]+)(?::\d+)?;(\d+), replacement: $1:$2, target_label: __address__}
          - {source_labels: [__meta_kubernetes_pod_label_app], target_label: app}
          - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - job_name: dcgm
        kubernetes_sd_configs: [{role: pod, namespaces: {names: [mlsysbook]}}]
        relabel_configs:
          - {source_labels: [__meta_kubernetes_pod_label_app], action: keep, regex: dcgm-exporter}
          - {source_labels: [__address__], action: replace, regex: ([^:]+)(?::\d+)?, replacement: $1:9400, target_label: __address__}
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config: {ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt, insecure_skip_verify: true}
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs: [{role: node}]
        relabel_configs:
          - {action: labelmap, regex: __meta_kubernetes_node_label_(.+)}
          - {target_label: __address__, replacement: kubernetes.default.svc:443}
          - {source_labels: [__meta_kubernetes_node_name], regex: (.+), target_label: __metrics_path__, replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor}
      - job_name: kube-state            # replica counts for the HPA panel (kube-state-metrics if installed; else the HPA panel uses the kubelet series)
        static_configs: [{targets: ["kube-state-metrics.kube-system.svc:8080"]}]
