apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: mlsysbook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlsysbook-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlsysbook-prometheus
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mlsysbook-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: mlsysbook}]
