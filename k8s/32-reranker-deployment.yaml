# Placement decision (M3 attempt 5, docs/benchmarks/m3-baseline.md): the reranker belongs on the GPU next to
# vLLM (261 ms vs 22 s on CPU). The NVIDIA device plugin hands a whole GPU to one pod, so co-residency in k8s
# needs time-slicing (k8s/_nvidia-device-plugin-timeslicing.yaml: the single GPU is advertised as 2 slices);
# then set RERANKER_MODE=gpu, use the -gpu image, and request nvidia.com/gpu: 1 here. Until that is applied,
# this manifest runs the reranker on CPU so the stack still comes up — with the measured latency penalty.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reranker
  namespace: mlsysbook
spec:
  replicas: 1
  selector:
    matchLabels: {app: reranker}
  template:
    metadata:
      labels: {app: reranker}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8002"}
    spec:
      containers:
        - name: reranker
          image: mlsysbook-rag/reranker:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: RERANKER_MODE, value: cpu}
            - {name: RERANKER_MAX_LENGTH, value: "512"}
            - {name: HF_HOME, value: /data/hf-cache}
          ports: [{containerPort: 8002}]
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "6", memory: 6Gi}
          volumeMounts: [{name: hf-cache, mountPath: /data/hf-cache}]
          startupProbe: {httpGet: {path: /health, port: 8002}, periodSeconds: 10, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /health, port: 8002}, periodSeconds: 10}
      volumes:
        - name: hf-cache
          hostPath: {path: /var/lib/mlsysbook/hf-cache, type: DirectoryOrCreate}
