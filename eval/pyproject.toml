[project]
name = "mlsys-eval"
version = "0.1.0"
description = "Golden set, verification CLI, retrieval + LLM-judge metrics, report"
requires-python = ">=3.12"
dependencies = ["mlsys-common", "mlsys-gateway", "anthropic>=0.40", "httpx>=0.27", "typer>=0.12", "rich>=13", "pyyaml>=6.0", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["mlsys_eval"]
[tool.uv.sources]
mlsys-common = { workspace = true }
mlsys-gateway = { workspace = true }
