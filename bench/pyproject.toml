[project]
name = "mlsys-bench"
version = "0.1.0"
description = "Async load generator, sweeps, and result tables"
requires-python = ">=3.12"
dependencies = ["mlsys-common", "mlsys-eval", "httpx>=0.27", "pyyaml>=6.0", "numpy>=1.26", "typer>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["mlsys_bench"]
[tool.uv.sources]
mlsys-common = { workspace = true }
mlsys-eval = { workspace = true }
