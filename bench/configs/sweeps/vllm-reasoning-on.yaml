# Lever: reasoning on (Qwen3.8 default) vs off (serving default). Affects TTFT heavily.
name: sweep-reasoning-on
target: openai
base_url: http://localhost:8003/v1
model: qwen38-27b-w4a16
serving_config: config/serving/vllm-qwen38-27b.yaml
lever: "chat_template_kwargs.enable_thinking=true"
max_tokens: 1024
extra_body:
  chat_template_kwargs: {enable_thinking: true}
concurrency: [1, 8]
requests_per_level: 32
